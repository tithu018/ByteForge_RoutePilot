name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: waypoint
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://waypoint:ci_local_only@localhost:5432/waypoint?schema=public
      NODE_ENV: test
      API_PORT: 3000
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke tests against live stack
        run: |
          pnpm --filter @waypoint/api start > /tmp/waypoint-api.log 2>&1 &
          pnpm --filter @waypoint/web dev > /tmp/waypoint-web.log 2>&1 &
          node scripts/wait-for-services.mjs
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
